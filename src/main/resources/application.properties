spring.application.name=SistemParcan
# Configuracion de la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/sistemparcan_bd
spring.datasource.username=postgres
# Contrasena local de desarrollo; se puede sobrescribir con la variable DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA / Hibernate
# Actualiza el esquema de la base al iniciar sin borrar los datos existentes
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL generadas en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Permite cargar relaciones perezosas aunque no haya una transaccion abierta
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Servidor
server.port=8080
# Incluye el mensaje y la traza del error en las respuestas para facilitar las pruebas
server.error.include-message=always
server.error.include-stacktrace=always
