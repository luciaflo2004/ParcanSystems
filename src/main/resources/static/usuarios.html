<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SystemParCan - Usuarios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
    <div class="main-content">
        <div class="content">
            <div class="page-head">
                <h3>Usuarios Registrados</h3>
                <div class="head-actions">
                    <button class="btn btn-primary" onclick="resetUsuarioForm()"><i class="fa-solid fa-plus"></i> Nuevo</button>
                </div>
            </div>

            <div class="card">
                <h3 id="form-title">Registrar Usuario</h3>
                <form id="usuario-form">
                    <div class="form-group"><label>Usuario:</label><input type="text" name="usuario" id="usuario" required></div>
                    <div class="form-group">
                        <label>Contraseña:</label>
                        <div class="solicitante-row">
                            <input type="password" name="contrasena" id="contrasena" autocomplete="new-password">
                            <button type="button" class="btn btn-outline" id="toggle-password" onclick="togglePassword()" aria-label="Mostrar u ocultar contraseña" title="Mostrar u ocultar contraseña"><i class="fa-solid fa-eye" id="toggle-password-icon"></i></button>
                        </div>
                        <small class="password-hint" id="password-hint">Utilice al menos 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial.</small>
                    </div>
                    <div class="form-group">
                        <label>Funcionario:</label>
                        <div class="solicitante-row">
                            <select name="funcionario" id="funcionario-select"></select>
                            <button type="button" class="btn btn-outline" onclick="crearFuncionario()"><i class="fa-solid fa-plus"></i> Crear</button>
                        </div>
                    </div>
                    <div class="form-group"><label>Cargo:</label><select name="cargo" id="cargo-select"></select></div>
                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                        <button type="button" class="btn btn-outline" onclick="resetUsuarioForm()"><i class="fa-solid fa-rotate-left"></i> Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Barra de filtros y boton imprimir, como encabezado de la lista -->
            <div class="filter-bar">
                <div class="f-group"><label>Buscar texto</label><input type="text" id="search-usuarios" placeholder="Usuario, CI funcionario..."></div>
                <div class="f-group"><label>Estado</label>
                    <select id="filtro-estado">
                        <option value="todos">Todos</option>
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>
                <button class="btn btn-outline" onclick="clearFiltrosUsuarios()"><i class="fa-solid fa-eraser"></i> Limpiar</button>
                <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Imprimir</button>
            </div>

            <div class="card print-area">
                <h3>Lista de Usuarios</h3>
                <div id="usuarios-list">Cargando...</div>
            </div>
        </div>
    </div>
    <script src="js/app.js?v=11"></script>
    <script src="js/usuarios.js?v=10"></script>
</body>
</html>
