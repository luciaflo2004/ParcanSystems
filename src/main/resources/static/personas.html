<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SystemParCan - Personas y Funcionarios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-content">
        <div class="content">
            <div class="page-head">
                <h3>Personas y Funcionarios</h3>
                <div class="head-actions">
                    <button class="btn btn-primary" onclick="resetForm()"><i class="fa-solid fa-plus"></i> Nuevo</button>
                </div>
            </div>

            <!-- Formulario unificado: datos personales + rol (Persona o Funcionario) -->
            <div class="card">
                <h3 id="form-title">Registrar Persona / Funcionario</h3>
                <form id="persona-form">
                    <div class="form-group"><label>CI:</label><input type="text" name="ciPersona" id="ciPersona" required></div>
                    <div class="form-group"><label>Nombre:</label><input type="text" name="nombrePersona" id="nombrePersona" required></div>
                    <div class="form-group"><label>Apellido:</label><input type="text" name="apellidoPersona" id="apellidoPersona" required></div>
                    <div class="form-group"><label>Fecha Nacimiento:</label><input type="date" name="fechaNacPersona" id="fechaNacPersona" required min="1930-01-01"></div>
                    <div class="form-group"><label>Direccion:</label><input type="text" name="direccionPersona" id="direccionPersona"></div>
                    <div class="form-group"><label>Telefono:</label><input type="text" name="telefonoPersona" id="telefonoPersona"></div>

                    <!-- Seleccion de rol: PERSONA o FUNCIONARIO -->
                    <div class="form-group">
                        <label>Rol:</label>
                        <select name="rol" id="rol-select">
                            <option value="PERSONA">Persona</option>
                            <option value="FUNCIONARIO">Funcionario</option>
                        </select>
                    </div>

                    <!-- Cargo: se muestra solo si el rol es Funcionario -->
                    <div class="form-group hidden" id="cargo-group">
                        <label>Cargo:</label>
                        <select name="cargo" id="cargo-select"></select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                        <button type="button" class="btn btn-outline" onclick="resetForm()"><i class="fa-solid fa-rotate-left"></i> Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Barra de filtros y boton imprimir, como encabezado de la lista -->
            <div class="filter-bar">
                <div class="f-group"><label>Buscar texto</label><input type="text" id="search-personas" placeholder="Nombre, CI, teléfono..."></div>
                <div class="f-group"><label>Estado</label>
                    <select id="filtro-estado">
                        <option value="todos">Todos</option>
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>
                <div class="f-group"><label>Rol</label>
                    <select id="filtro-rol">
                        <option value="todos">Todos</option>
                        <option value="persona">Persona</option>
                        <option value="funcionario">Funcionario</option>
                    </select>
                </div>
                <button class="btn btn-outline" onclick="clearFiltrosPersonas()"><i class="fa-solid fa-eraser"></i> Limpiar</button>
                <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Imprimir</button>
            </div>

            <!-- Lista de personas registradas -->
            <div class="card print-area">
                <h3>Lista de Personas</h3>
                <div id="personas-list">Cargando...</div>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/personas.js"></script>
</body>
</html>
