<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SystemParCan - Instituciones Eclesiasticas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="main-content">
        <div class="content">
            <div class="page-head">
                <h3>Instituciones Registradas</h3>
                <div class="head-actions">
                    <button class="btn btn-primary" onclick="resetInstitucionForm()"><i class="fa-solid fa-plus"></i> Nuevo</button>
                </div>
            </div>

            <div class="card">
                <h3 id="form-title">Registrar Institución</h3>
                <form id="institucion-form">
                    <div class="form-group"><label>Diosesis:</label><input type="text" name="diosesis" id="diosesis"></div>
                    <div class="form-group"><label>Nombre:</label><input type="text" name="nombre" id="nombre" required></div>
                    <div class="form-group"><label>Tipo:</label>
                        <select name="tipo" id="tipo"><option value="Basilica">Basilica</option><option value="Santuario">Santuario</option><option value="Catedral">Catedral</option><option value="Parroquia">Parroquia</option></select>
                    </div>
                    <div class="form-group"><label>Ciudad:</label><input type="text" name="ciudad" id="ciudad"></div>
                    <div class="form-actions">
                        <button type="submit" id="submit-btn" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Guardar</button>
                        <button type="button" class="btn btn-outline" onclick="resetInstitucionForm()"><i class="fa-solid fa-rotate-left"></i> Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Barra de filtros y boton imprimir, como encabezado de la lista -->
            <div class="filter-bar">
                <div class="f-group"><label>Buscar texto</label><input type="text" id="search-instituciones" placeholder="Nombre, ciudad..."></div>
                <div class="f-group"><label>Estado</label>
                    <select id="filtro-estado">
                        <option value="todos">Todos</option>
                        <option value="activo">Activo</option>
                        <option value="inactivo">Inactivo</option>
                    </select>
                </div>
                <button class="btn btn-outline" onclick="clearFiltrosInstituciones()"><i class="fa-solid fa-eraser"></i> Limpiar</button>
                <button class="btn btn-primary" onclick="window.print()"><i class="fa-solid fa-print"></i> Imprimir</button>
            </div>

            <div class="card print-area">
                <h3>Lista de Instituciones</h3>
                <div id="instituciones-list">Cargando...</div>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/instituciones.js"></script>
</body>
</html>
