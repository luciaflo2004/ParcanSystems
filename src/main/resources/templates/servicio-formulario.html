<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${servicio.idServicio == null ? 'Nuevo Servicio' : 'Editar Servicio'}">Formulario Servicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            position: fixed;
            height: 100%;
            padding: 20px 0;
            top: 0;
            left: 0;
        }
        .sidebar h3 {
            text-align: center;
            margin-bottom: 30px;
            color: #f0b429;
        }
        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background: #34495e;
            padding-left: 25px;
        }
        .content {
            margin-left: 250px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Parcan Systems</h3>
        <a th:href="@{/home}"><i class="fas fa-home"></i> Inicio</a>
        <a th:href="@{/personas}"><i class="fas fa-users"></i> Personas</a>
        <a th:href="@{/solicitudes}"><i class="fas fa-file-alt"></i> Solicitudes</a>
        <a th:href="@{/servicios}" class="active"><i class="fas fa-hands-helping"></i> Servicios</a>
        <a th:href="@{/instituciones}"><i class="fas fa-building"></i> Instituciones</a>
        <a th:href="@{/logout}" class="mt-5"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </div>

    <div class="content">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">
                    <i class="fas fa-hands-helping"></i> 
                    <span th:text="${servicio.idServicio == null ? 'Nuevo Servicio' : 'Editar Servicio'}"></span>
                </h3>
            </div>
            <div class="card-body">
                <div th:if="${error}" class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span>
                </div>
                
                <form th:action="${servicio.idServicio == null ? '/servicios/guardar' : '/servicios/actualizar/' + servicio.idServicio}" 
                      th:object="${servicio}" 
                      method="post">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nombreServicio" class="form-label">Nombre del Servicio *</label>
                            <input type="text" class="form-control" id="nombreServicio" th:field="*{nombreServicio}" required>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="costoServicio" class="form-label">Costo</label>
                            <input type="number" class="form-control" id="costoServicio" th:field="*{costoServicio}" step="1000">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fechaServicio" class="form-label">Fecha del Servicio</label>
                            <input type="datetime-local" class="form-control" id="fechaServicio" th:field="*{fechaServicio}">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="ubicacion" class="form-label">Ubicación</label>
                            <input type="text" class="form-control" id="ubicacion" th:field="*{ubicacion}">
                        </div>
                    </div>
                    
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Guardar</button>
                        <a th:href="@{/servicios}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
