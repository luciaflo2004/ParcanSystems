<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Parcan - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            position: fixed;
            height: 100%;
            padding: 20px 0;
        }
        .sidebar a {
            display: block;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
        }
        .sidebar a:hover {
            background: #34495e;
        }
        .content {
            margin-left: 250px;
            padding: 20px;
        }
        .card-menu {
            transition: transform 0.3s;
            cursor: pointer;
        }
        .card-menu:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3 class="text-center mb-4">Parcan Systems</h3>
        <a th:href="@{/home}"><i class="fas fa-home"></i> Inicio</a>
        <a th:href="@{/personas}"><i class="fas fa-users"></i> Personas</a>
        <a th:href="@{/solicitudes}"><i class="fas fa-file-alt"></i> Solicitudes</a>
        <a th:href="@{/servicios}"><i class="fas fa-hands-helping"></i> Servicios</a>
        <a th:href="@{/instituciones}"><i class="fas fa-building"></i> Instituciones</a>
        <a th:href="@{/logout}" class="mt-5"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </div>

    <div class="content">
        <div class="header bg-primary text-white p-3 rounded mb-4">
            <h1>Panel Administrativo Parroquial</h1>
            <p>Bienvenido, <strong th:text="${session.usuarioLogueado != null ? session.usuarioLogueado.usuario : 'Usuario'}">Usuario</strong></p>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card card-menu text-center" onclick="location.href='/personas'">
                    <div class="card-body">
                        <i class="fas fa-users fa-3x text-primary"></i>
                        <h5 class="mt-2">Personas</h5>
                        <p>Gestionar personas del sistema</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card card-menu text-center" onclick="location.href='/solicitudes'">
                    <div class="card-body">
                        <i class="fas fa-file-alt fa-3x text-success"></i>
                        <h5 class="mt-2">Solicitudes</h5>
                        <p>Gestionar solicitudes</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card card-menu text-center" onclick="location.href='/instituciones'">
                    <div class="card-body">
                        <i class="fas fa-building fa-3x text-warning"></i>
                        <h5 class="mt-2">Instituciones</h5>
                        <p>Gestionar instituciones</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
