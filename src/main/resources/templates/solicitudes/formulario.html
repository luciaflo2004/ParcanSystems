<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo} + ' - Parcan Systems'">Solicitud - Parcan Systems</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .header h1 {
            font-size: 24px;
        }
        
        .btn-volver {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .btn-volver:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        label.required:after {
            content: " *";
            color: red;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .content {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 th:text="${titulo}">Formulario de Solicitud</h1>
            <a href="/solicitudes" class="btn-volver">← Volver al Listado</a>
        </div>
        
        <div class="content">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            
            <form th:action="@{/solicitudes/guardar}" th:object="${solicitud}" method="post" th:if="${accion == 'guardar'}">
                <div class="form-group">
                    <label for="feligresId" class="required">Feligrés</label>
                    <select id="feligresId" name="feligresId" required>
                        <option value="">Seleccione un feligrés</option>
                        <option th:each="feligres : ${feligreses}" 
                                th:value="${feligres.idPersona}"
                                th:text="${feligres.persona.nombrePersona} + ' ' + ${feligres.persona.apellidoPersona} + ' (CI: ' + ${feligres.persona.ci} + ')'"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="servicioId">Servicio Eclesial</label>
                    <select id="servicioId" name="servicioId">
                        <option value="">Seleccione un servicio (opcional)</option>
                        <option th:each="servicio : ${servicios}" 
                                th:value="${servicio.idServicio}"
                                th:text="${servicio.nombreServicio} + ' - ' + ${servicio.descripcion}"></option>
                    </select>
                    <div class="info-text">Seleccione solo si la solicitud está relacionada a un servicio específico</div>
                </div>
                
                <div class="form-group">
                    <label for="tipoSolicitud" class="required">Tipo de Solicitud</label>
                    <select id="tipoSolicitud" th:field="*{tipoSolicitud}" required>
                        <option value="">Seleccione un tipo</option>
                        <option th:each="tipo : ${tiposSolicitud}" 
                                th:value="${tipo}"
                                th:text="${tipo}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="descripcion" class="required">Descripción</label>
                    <textarea id="descripcion" th:field="*{descripcion}" 
                              placeholder="Describa detalladamente la solicitud..." required></textarea>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn-primary">💾 Guardar Solicitud</button>
                    <button type="button" class="btn-secondary" onclick="window.location.href='/solicitudes'">❌ Cancelar</button>
                </div>
            </form>
            
            <form th:action="@{/solicitudes/actualizar/{id}(id=${solicitud.idSolicitud})}" th:object="${solicitud}" method="post" th:if="${accion != 'guardar'}">
                <input type="hidden" name="feligresId" th:value="${solicitud.persona.idPersona}">
                
                <div class="form-group">
                    <label class="required">Feligrés</label>
                    <input type="text" th:value="${solicitud.persona.persona.nombrePersona} + ' ' + ${solicitud.persona.persona.apellidoPersona}" readonly disabled style="background: #f5f5f5;">
                </div>
                
                <div class="form-group">
                    <label for="servicioId">Servicio Eclesial</label>
                    <select id="servicioId" name="servicioId">
                        <option value="">Seleccione un servicio</option>
                        <option th:each="servicio : ${servicios}" 
                                th:value="${servicio.idServicio}"
                                th:text="${servicio.nombreServicio} + ' - ' + ${servicio.descripcion}"
                                th:selected="${servicio.idServicio == solicitud.servicio.idServicio}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="tipoSolicitud" class="required">Tipo de Solicitud</label>
                    <select id="tipoSolicitud" th:field="*{tipoSolicitud}" required>
                        <option th:each="tipo : ${tiposSolicitud}" 
                                th:value="${tipo}"
                                th:text="${tipo}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" th:field="*{estado}">
                        <option th:each="estado : ${tiposEstado}" 
                                th:value="${estado}"
                                th:text="${estado}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="descripcion" class="required">Descripción</label>
                    <textarea id="descripcion" th:field="*{descripcion}" required></textarea>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn-primary">💾 Actualizar Solicitud</button>
                    <button type="button" class="btn-secondary" onclick="window.location.href='/solicitudes'">❌ Cancelar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
