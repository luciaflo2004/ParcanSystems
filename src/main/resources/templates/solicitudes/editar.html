<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Solicitud - Parcan Systems</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .estado-actual {
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 10px;
            }
            
            .content {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ Editar Solicitud</h1>
            <p>Modifique los datos de la solicitud</p>
        </div>
        
        <div class="content">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            
            <div class="estado-actual">
                <strong>Estado actual:</strong> 
                <span th:class="'estado ' + 'estado-' + ${solicitud.estado}" th:text="${solicitud.estado}"></span>
            </div>
            
            <form th:action="@{/solicitudes/actualizar/{id}(id=${solicitud.idSolicitud})}" th:object="${solicitud}" method="post">
                <div class="form-group">
                    <label for="feligresId">Feligrés</label>
                    <select id="feligresId" name="feligresId" required>
                        <option value="">Seleccione un feligrés</option>
                        <option th:each="feligres : ${feligreses}" 
                                th:value="${feligres.idPersona}"
                                th:text="${feligres.persona.nombrePersona} + ' ' + ${feligres.persona.apellidoPersona} + ' (CI: ' + ${feligres.persona.ci} + ')'"
                                th:selected="${feligres.idPersona == solicitud.persona.idPersona}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="servicioId">Servicio Eclesial</label>
                    <select id="servicioId" name="servicioId">
                        <option value="">Seleccione un servicio (opcional)</option>
                        <option th:each="servicio : ${servicios}" 
                                th:value="${servicio.idServicio}"
                                th:text="${servicio.nombreServicio} + ' - ' + ${servicio.descripcion}"
                                th:selected="${servicio.idServicio == solicitud.servicio.idServicio}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="tipoSolicitud">Tipo de Solicitud</label>
                    <select id="tipoSolicitud" th:field="*{tipoSolicitud}" required>
                        <option th:each="tipo : ${tiposSolicitud}" 
                                th:value="${tipo}"
                                th:text="${tipo}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" th:field="*{estado}" required>
                        <option th:each="estado : ${tiposEstado}" 
                                th:value="${estado}"
                                th:text="${estado}"></option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" th:field="*{descripcion}" 
                              placeholder="Describa detalladamente la solicitud..." required></textarea>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn-primary">💾 Actualizar Solicitud</button>
                    <button type="button" class="btn-secondary" onclick="window.location.href='/solicitudes/lista'">❌ Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    
    <style>
        .estado-PENDIENTE {
            background: #fff3cd;
            color: #856404;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        
        .estado-APROBADA {
            background: #d4edda;
            color: #155724;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        
        .estado-RECHAZADA {
            background: #f8d7da;
            color: #721c24;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        
        .estado-COMPLETADA {
            background: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
    </style>
</body>
</html>
