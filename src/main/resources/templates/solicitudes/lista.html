<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Solicitudes - Parcan Systems</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .header h1 {
            font-size: 28px;
        }
        
        .btn-nuevo {
            background: white;
            color: #667eea;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
            display: inline-block;
        }
        
        .btn-nuevo:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .stats {
            display: flex;
            gap: 20px;
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            flex-wrap: wrap;
        }
        
        .stat-card {
            flex: 1;
            min-width: 150px;
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        
        .content {
            padding: 30px;
            overflow-x: auto;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        tbody tr:hover {
            background: #f5f5f5;
        }
        
        .estado {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        
        .estado-PENDIENTE {
            background: #fff3cd;
            color: #856404;
        }
        
        .estado-APROBADA {
            background: #d4edda;
            color: #155724;
        }
        
        .estado-RECHAZADA {
            background: #f8d7da;
            color: #721c24;
        }
        
        .estado-COMPLETADA {
            background: #cce5ff;
            color: #004085;
        }
        
        .acciones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn-accion {
            padding: 5px 10px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-block;
        }
        
        .btn-editar {
            background: #007bff;
            color: white;
        }
        
        .btn-eliminar {
            background: #dc3545;
            color: white;
        }
        
        .btn-accion:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        select.estado-select {
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ddd;
            font-size: 12px;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .stats {
                flex-direction: column;
            }
            
            .acciones {
                flex-direction: column;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Gestión de Solicitudes</h1>
            <a href="/solicitudes/nuevo" class="btn-nuevo">➕ Nueva Solicitud</a>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h3>📊 Total Solicitudes</h3>
                <div class="number" th:text="${totalSolicitudes}">0</div>
            </div>
            <div class="stat-card">
                <h3>⏳ Pendientes</h3>
                <div class="number" th:text="${totalPendientes}">0</div>
            </div>
            <div class="stat-card">
                <h3>✅ Aprobadas</h3>
                <div class="number" th:text="${totalAprobadas}">0</div>
            </div>
            <div class="stat-card">
                <h3>❌ Rechazadas</h3>
                <div class="number" th:text="${totalRechazadas}">0</div>
            </div>
            <div class="stat-card">
                <h3>🎉 Completadas</h3>
                <div class="number" th:text="${totalCompletadas}">0</div>
            </div>
        </div>
        
        <div class="content">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Feligrés</th>
                        <th>Tipo</th>
                        <th>Servicio</th>
                        <th>Descripción</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="solicitud : ${solicitudes}">
                        <td th:text="${solicitud.idSolicitud}"></td>
                        <td th:text="${solicitud.persona.persona.nombrePersona} + ' ' + ${solicitud.persona.persona.apellidoPersona}"></td>
                        <td th:text="${solicitud.tipoSolicitud}"></td>
                        <td th:text="${solicitud.servicio != null ? solicitud.servicio.nombreServicio : 'No aplica'}"></td>
                        <td th:text="${solicitud.descripcion}"></td>
                        <td th:text="${#temporals.format(solicitud.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span th:class="'estado ' + 'estado-' + ${solicitud.estado}" th:text="${solicitud.estado}"></span>
                        </td>
                        <td class="acciones">
                            <a th:href="@{/solicitudes/editar/{id}(id=${solicitud.idSolicitud})}" class="btn-accion btn-editar">✏️ Editar</a>
                            <a th:href="@{/solicitudes/eliminar/{id}(id=${solicitud.idSolicitud})}" 
                               class="btn-accion btn-eliminar"
                               onclick="return confirm('¿Está seguro de eliminar esta solicitud?')">🗑️ Eliminar</a>
                            <form th:action="@{/solicitudes/cambiar-estado/{id}(id=${solicitud.idSolicitud})}" method="get" style="display: inline;">
                                <select name="estado" class="estado-select" onchange="this.form.submit()">
                                    <option th:each="estado : ${tiposEstado}"
                                            th:value="${estado}"
                                            th:text="${estado}"
                                            th:selected="${estado == solicitud.estado}">
                                    </option>
                                </select>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${solicitudes.empty}">
                        <td colspan="8" style="text-align: center; padding: 40px;">
                            No hay solicitudes registradas
                            <br><br>
                            <a href="/solicitudes/nuevo" style="color: #667eea; text-decoration: none; font-weight: bold;">➕ Crear primera solicitud</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
