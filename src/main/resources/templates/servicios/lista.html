<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Servicios - Parcan Systems</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .header h1 {
            font-size: 28px;
        }
        
        .btn-nuevo {
            background: white;
            color: #667eea;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s;
            display: inline-block;
        }
        
        .btn-nuevo:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .stats {
            display: flex;
            gap: 20px;
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .stat-card {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        
        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }
        
        .content {
            padding: 30px;
            overflow-x: auto;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        
        tbody tr:hover {
            background: #f5f5f5;
        }
        
        .costo {
            color: #28a745;
            font-weight: bold;
        }
        
        .acciones {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn-accion {
            padding: 5px 10px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-block;
        }
        
        .btn-editar {
            background: #007bff;
            color: white;
        }
        
        .btn-eliminar {
            background: #dc3545;
            color: white;
        }
        
        .btn-accion:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .stats {
                flex-direction: column;
            }
            
            .acciones {
                flex-direction: column;
            }
            
            table {
                font-size: 12px;
            }
            
            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⛪ Lista de Servicios Eclesiales</h1>
            <a href="/servicios/nuevo" class="btn-nuevo">➕ Nuevo Servicio</a>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <h3>📊 Total Servicios</h3>
                <div class="number" th:text="${totalServicios}">0</div>
            </div>
        </div>
        
        <div class="content">
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Costo</th>
                        <th>Ubicación</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="servicio : ${servicios}">
                        <td th:text="${servicio.idServicio}"></td>
                        <td th:text="${servicio.nombreServicio}"></td>
                        <td th:text="${servicio.descripcion}"></td>
                        <td class="costo" th:text="'Gs. ' + ${#numbers.formatDecimal(servicio.costoServicio, 0, 'COMMA')}"></td>
                        <td th:text="${servicio.ubicacion != null ? servicio.ubicacion : 'No especificada'}"></td>
                        <td th:text="${servicio.fechaServicio != null ? #temporals.format(servicio.fechaServicio, 'dd/MM/yyyy HH:mm') : 'No especificada'}"></td>
                        <td class="acciones">
                            <a th:href="@{/servicios/editar/{id}(id=${servicio.idServicio})}" class="btn-accion btn-editar">✏️ Editar</a>
                            <a th:href="@{/servicios/eliminar/{id}(id=${servicio.idServicio})}" 
                               class="btn-accion btn-eliminar"
                               onclick="return confirm('¿Está seguro de eliminar este servicio?')">🗑️ Eliminar</a>
                        </td>
                    </tr>
                    <tr th:if="${servicios.empty}">
                        <td colspan="7" style="text-align: center; padding: 40px;">
                            No hay servicios registrados
                            <br><br>
                            <a href="/servicios/nuevo" style="color: #667eea; text-decoration: none; font-weight: bold;">➕ Crear primer servicio</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
