<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Formulario Institución</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            position: fixed;
            height: 100%;
            padding: 20px 0;
            top: 0;
            left: 0;
            z-index: 100;
        }
        .sidebar h3 {
            text-align: center;
            margin-bottom: 30px;
            color: #f0b429;
        }
        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background: #34495e;
            padding-left: 25px;
        }
        .sidebar a.active {
            background: #34495e;
            border-left: 4px solid #f0b429;
        }
        .content {
            margin-left: 250px;
            padding: 20px;
        }
        .form-card {
            max-width: 800px;
            margin: 0 auto;
        }
        .required:after {
            content: " *";
            color: red;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <h3>Parcan Systems</h3>
        <a th:href="@{/home}"><i class="fas fa-home"></i> Inicio</a>
        <a th:href="@{/personas}"><i class="fas fa-users"></i> Personas</a>
        <a th:href="@{/solicitudes}"><i class="fas fa-file-alt"></i> Solicitudes</a>
        <a th:href="@{/servicios}"><i class="fas fa-hands-helping"></i> Servicios</a>
        <a th:href="@{/instituciones}" class="active"><i class="fas fa-building"></i> Instituciones</a>
        <a th:href="@{/logout}" class="mt-5"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </div>

    <!-- Contenido principal -->
    <div class="content">
        <div class="card form-card">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">
                    <i class="fas fa-building"></i> 
                    <span th:text="${titulo}">Formulario de Institución</span>
                </h3>
            </div>
            <div class="card-body">
                <!-- Mensajes de error -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Formulario -->
                <form th:action="${institucion.idInstitucionEclesiastica == null ? '/instituciones/guardar' : '/instituciones/actualizar/' + institucion.idInstitucionEclesiastica}" 
                      th:object="${institucion}" 
                      method="post">
                    
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label for="nombre" class="form-label required">Nombre</label>
                            <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                            <div class="form-text">Nombre completo de la institución eclesiástica</div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="tipo" class="form-label required">Tipo</label>
                            <select class="form-select" id="tipo" th:field="*{tipo}" required>
                                <option value="">Seleccione un tipo</option>
                                <option value="PARROQUIA">Parroquia</option>
                                <option value="CAPILLA">Capilla</option>
                                <option value="CATEDRAL">Catedral</option>
                                <option value="SANTUARIO">Santuario</option>
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="diosesis" class="form-label">Diócesis</label>
                            <input type="text" class="form-control" id="diosesis" th:field="*{diosesis}" placeholder="Ej: Asunción, Caaguazú, etc.">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label for="ciudad" class="form-label">Ciudad</label>
                            <input type="text" class="form-control" id="ciudad" th:field="*{ciudad}" placeholder="Ciudad donde se encuentra ubicada">
                        </div>
                    </div>

                    <div class="mt-4 d-flex justify-content-between">
                        <a th:href="@{/instituciones}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Guardar Institución
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
