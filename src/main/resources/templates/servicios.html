<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios Eclesiales - Parcan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            position: fixed;
            height: 100%;
            padding: 20px 0;
            top: 0;
            left: 0;
        }
        .sidebar h3 {
            text-align: center;
            margin-bottom: 30px;
            color: #f0b429;
        }
        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background: #34495e;
            padding-left: 25px;
        }
        .sidebar a.active {
            background: #34495e;
            border-left: 4px solid #f0b429;
        }
        .content {
            margin-left: 250px;
            padding: 20px;
        }
        .btn-eliminar {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Parcan Systems</h3>
        <a th:href="@{/home}"><i class="fas fa-home"></i> Inicio</a>
        <a th:href="@{/personas}"><i class="fas fa-users"></i> Personas</a>
        <a th:href="@{/solicitudes}"><i class="fas fa-file-alt"></i> Solicitudes</a>
        <a th:href="@{/servicios}" class="active"><i class="fas fa-hands-helping"></i> Servicios</a>
        <a th:href="@{/instituciones}"><i class="fas fa-building"></i> Instituciones</a>
        <a th:href="@{/logout}" class="mt-5"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</a>
    </div>

    <div class="content">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0"><i class="fas fa-hands-helping"></i> Servicios Eclesiales</h3>
                <a th:href="@{/servicios/nuevo}" class="btn btn-light">
                    <i class="fas fa-plus"></i> Nuevo Servicio
                </a>
            </div>
            <div class="card-body">
                <!-- Mensajes de éxito/error -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                    <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                    <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Tabla de servicios -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Costo</th>
                                <th>Fecha</th>
                                <th>Ubicación</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="servicio : ${servicios}">
                                <td th:text="${servicio.idServicio}"></td>
                                <td th:text="${servicio.nombreServicio}"></td>
                                <td th:text="${servicio.descripcion}"></td>
                                <td>
                                    <span th:if="${servicio.costoServicio != null}">
                                        $ <span th:text="${servicio.costoServicio}"></span>
                                    </span>
                                    <span th:if="${servicio.costoServicio == null}">N/A</span>
                                </td>
                                <td th:text="${servicio.fechaServicio != null ? #temporals.format(servicio.fechaServicio, 'dd/MM/yyyy HH:mm') : 'N/A'}"></td>
                                <td th:text="${servicio.ubicacion != null ? servicio.ubicacion : 'N/A'}"></td>
                                <td>
                                    <a th:href="@{/servicios/editar/{id}(id=${servicio.idServicio})}" 
                                       class="btn btn-sm btn-warning">
                                        <i class="fas fa-edit"></i>
                                    </a>
                                    <button th:data-id="${servicio.idServicio}" 
                                            class="btn btn-sm btn-danger btn-eliminar">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            <tr th:if="${servicios.isEmpty()}">
                                <td colspan="7" class="text-center">No hay servicios registrados</td>
                             </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación para eliminar -->
    <div class="modal fade" id="modalEliminar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="fas fa-trash"></i> Confirmar Eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    ¿Está seguro que desea eliminar este servicio?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form th:action="@{/servicios/eliminar}" method="post">
                        <input type="hidden" name="id" id="servicioIdEliminar">
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.btn-eliminar').forEach(button => {
            button.addEventListener('click', function() {
                const id = this.getAttribute('data-id');
                document.getElementById('servicioIdEliminar').value = id;
                new bootstrap.Modal(document.getElementById('modalEliminar')).show();
            });
        });
    </script>
</body>
</html>
